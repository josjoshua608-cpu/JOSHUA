<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joshua | Luxury Bio</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

body {
  background: radial-gradient(circle at top, #1a1a1a, #000000);
  color: #fff;
  text-align: center;
  overflow-x: hidden;
}

/* Subtle gold glow animation */
body::before {
  content: "";
  position: fixed;
  width: 400px;
  height: 400px;
  background: radial-gradient(circle, rgba(212,175,55,0.2), transparent);
  top: -100px;
  right: -100px;
  filter: blur(80px);
  animation: glowMove 12s ease-in-out infinite alternate;
  z-index: -1;
}

@keyframes glowMove {
  from { transform: translateY(0px); }
  to { transform: translateY(80px); }
}

/* Glass Luxury Card */
.card {
  background: rgba(20,20,20,0.85);
  backdrop-filter: blur(15px);
  width: 90%;
  max-width: 360px;
  margin: 120px auto 40px;
  padding: 80px 25px 35px;
  border-radius: 25px;
  border: 1px solid rgba(212,175,55,0.3);
  box-shadow: 0 20px 50px rgba(0,0,0,0.6);
  position: relative;
  transition: transform 0.2s ease;
}

/* Gold border shimmer */
.card::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 25px;
  padding: 1px;
  background: linear-gradient(120deg, transparent, #d4af37, transparent);
  -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  animation: shimmer 4s linear infinite;
}

@keyframes shimmer {
  0% { background-position: -200px; }
  100% { background-position: 200px; }
}

/* Profile Image */
.profile-img {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid #d4af37;
  position: absolute;
  top: -60px;
  left: 50%;
  transform: translateX(-50%);
}

/* Typing */
.typing {
  font-size: 20px;
  font-weight: 600;
  color: #d4af37;
  margin-top: 10px;
  min-height: 28px;
}

/* Clock */
.clock {
  font-size: 13px;
  color: #aaa;
  margin: 8px 0 15px;
  letter-spacing: 2px;
}

/* Subtitle */
.subtitle {
  font-size: 14px;
  color: #ccc;
  margin: 10px 0;
}

.divider {
  width: 50px;
  height: 2px;
  background: linear-gradient(to right, transparent, #d4af37, transparent);
  margin: 15px auto 20px;
}

/* Luxury Buttons */
.btn {
  display: block;
  background: linear-gradient(145deg, #111, #1f1f1f);
  color: #d4af37;
  text-decoration: none;
  padding: 14px;
  margin: 12px auto;
  width: 90%;
  border-radius: 30px;
  font-size: 13px;
  letter-spacing: 2px;
  border: 1px solid rgba(212,175,55,0.3);
  transition: 0.3s;
}

.btn:hover {
  background: #d4af37;
  color: #000;
  transform: scale(1.05);
  box-shadow: 0 0 20px rgba(212,175,55,0.6);
}

.footer {
  margin: 20px 0 40px;
  font-size: 13px;
  color: #777;
}
</style>
</head>

<body>

<div class="card" id="tiltCard">
  <img src="https://images.unsplash.com/photo-1502685104226-ee32379fefbe" class="profile-img">

  <div class="typing" id="typingText"></div>
  <div class="clock" id="clock"></div>

  <div class="subtitle">MBA | Finance & Operations</div>
  <div class="divider"></div>

  <a href="#" class="btn">WEBSITE</a>
  <a href="#" class="btn">PORTFOLIO</a>
  <a href="#" class="btn">PROJECTS</a>
  <a href="#" class="btn">RESUME</a>
  <a href="mailto:yourmail@gmail.com" class="btn">CONTACT</a>
</div>

<div class="footer">© Joshua Panimaya Raj</div>

<script>
/* Typing Animation */
const text = "Joshua Panimaya Raj";
let index = 0;
function typeEffect() {
  if (index < text.length) {
    document.getElementById("typingText").innerHTML += text.charAt(index);
    index++;
    setTimeout(typeEffect, 80);
  }
}
typeEffect();

/* Live Clock */
function updateClock() {
  const now = new Date();
  document.getElementById("clock").innerHTML =
    now.toLocaleTimeString();
}
setInterval(updateClock, 1000);
updateClock();

/* 3D Tilt */
const card = document.getElementById("tiltCard");

card.addEventListener("mousemove", (e) => {
  const rect = card.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  const centerX = rect.width / 2;
  const centerY = rect.height / 2;

  const rotateX = -(y - centerY) / 20;
  const rotateY = (x - centerX) / 20;

  card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
});

card.addEventListener("mouseleave", () => {
  card.style.transform = "rotateX(0deg) rotateY(0deg)";
});
</script>

</body>
</html>
