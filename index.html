<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joshua | Bio Link</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

/* ===== Animated Background ===== */
body {
  text-align: center;
  overflow-x: hidden;
  background: linear-gradient(-45deg, #d9cfc3, #e6dfd7, #cfc6bb, #ddd3c8);
  background-size: 400% 400%;
  animation: gradientMove 15s ease infinite;
}

@keyframes gradientMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* Floating circles */
.bg-circle {
  position: fixed;
  border-radius: 50%;
  filter: blur(70px);
  opacity: 0.4;
  z-index: -1;
  animation: float 18s infinite ease-in-out alternate;
}

.circle1 {
  width: 250px;
  height: 250px;
  background: white;
  top: 5%;
  left: -80px;
}

.circle2 {
  width: 300px;
  height: 300px;
  background: black;
  bottom: 10%;
  right: -120px;
  animation-delay: 6s;
}

@keyframes float {
  from { transform: translateY(0px); }
  to { transform: translateY(50px); }
}

/* ===== Card ===== */
.card {
  background: white;
  width: 90%;
  max-width: 360px;
  margin: 120px auto 30px;
  padding: 70px 20px 30px;
  border-radius: 25px;
  box-shadow: 0 15px 35px rgba(0,0,0,0.2);
  position: relative;
  transition: transform 0.2s ease;
}

/* Profile */
.profile-img {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  object-fit: cover;
  border: 5px solid white;
  position: absolute;
  top: -60px;
  left: 50%;
  transform: translateX(-50%);
}

/* Typing Text */
.typing {
  font-size: 20px;
  font-weight: bold;
  margin-top: 10px;
  min-height: 28px;
}

/* Clock */
.clock {
  font-size: 14px;
  color: #555;
  margin: 8px 0 15px;
  letter-spacing: 1px;
}

.subtitle {
  font-size: 14px;
  color: #666;
  margin: 10px 0;
}

.divider {
  width: 40px;
  height: 2px;
  background: #333;
  margin: 10px auto 15px;
}

/* Buttons */
.btn {
  display: block;
  background: #222;
  color: white;
  text-decoration: none;
  padding: 14px;
  margin: 10px auto;
  width: 90%;
  border-radius: 30px;
  font-size: 14px;
  letter-spacing: 1px;
  transition: 0.3s;
}

.btn:hover {
  background: #444;
  transform: scale(1.05);
}

/* Footer */
.footer {
  margin: 20px 0 40px;
  font-size: 14px;
  color: #444;
}
</style>
</head>

<body>

<div class="bg-circle circle1"></div>
<div class="bg-circle circle2"></div>

<div class="card" id="tiltCard">
  <img src="https://images.unsplash.com/photo-1502685104226-ee32379fefbe" class="profile-img">
  
  <div class="typing" id="typingText"></div>
  <div class="clock" id="clock"></div>

  <div class="subtitle">MBA | Finance & Operations</div>
  <div class="divider"></div>

  <a href="#" class="btn">WEBSITE</a>
  <a href="#" class="btn">PORTFOLIO</a>
  <a href="#" class="btn">NEW POST</a>
  <a href="#" class="btn">MY STORE</a>
  <a href="mailto:yourmail@gmail.com" class="btn">CONTACT ME</a>
</div>

<div class="footer">@joshuapersonal</div>

<script>
/* ===== Typing Animation ===== */
const text = "Joshua Panimaya Raj";
let index = 0;
function typeEffect() {
  if (index < text.length) {
    document.getElementById("typingText").innerHTML += text.charAt(index);
    index++;
    setTimeout(typeEffect, 70);
  }
}
typeEffect();

/* ===== Live Clock ===== */
function updateClock() {
  const now = new Date();
  const time = now.toLocaleTimeString();
  document.getElementById("clock").innerHTML = time;
}
setInterval(updateClock, 1000);
updateClock();

/* ===== 3D Tilt Effect (Mobile + Desktop) ===== */
const card = document.getElementById("tiltCard");

card.addEventListener("mousemove", (e) => {
  const rect = card.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  
  const centerX = rect.width / 2;
  const centerY = rect.height / 2;
  
  const rotateX = -(y - centerY) / 15;
  const rotateY = (x - centerX) / 15;
  
  card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
});

card.addEventListener("mouseleave", () => {
  card.style.transform = "rotateX(0deg) rotateY(0deg)";
});

/* Touch support */
card.addEventListener("touchmove", (e) => {
  const touch = e.touches[0];
  const rect = card.getBoundingClientRect();
  const x = touch.clientX - rect.left;
  const y = touch.clientY - rect.top;

  const centerX = rect.width / 2;
  const centerY = rect.height / 2;

  const rotateX = -(y - centerY) / 20;
  const rotateY = (x - centerX) / 20;

  card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
});

card.addEventListener("touchend", () => {
  card.style.transform = "rotateX(0deg) rotateY(0deg)";
});
</script>

</body>
</html>
