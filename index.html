<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joshua | Bio</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Arial', sans-serif;
}

body {
  background: #e6dfd7;
  text-align: center;
}

/* Top Blurred Background */
.top-bg {
  width: 100%;
  height: 220px;
  background: url('https://images.unsplash.com/photo-1524504388940-b1c1722653e1') center/cover no-repeat;
  filter: blur(6px);
}

/* Profile Image */
.profile-img {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  object-fit: cover;
  border: 5px solid white;
  margin-top: -60px;
}

/* Card */
.card {
  background: white;
  width: 90%;
  max-width: 360px;
  margin: -80px auto 20px;
  padding: 70px 20px 30px;
  border-radius: 25px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  position: relative;
}

h1 {
  font-size: 22px;
  margin-bottom: 5px;
}

.subtitle {
  font-size: 14px;
  color: #666;
  margin-bottom: 15px;
}

.divider {
  width: 40px;
  height: 2px;
  background: #333;
  margin: 10px auto 15px;
}

.description {
  font-size: 14px;
  color: #555;
  margin-bottom: 20px;
  line-height: 1.4;
}

/* Buttons */
.btn {
  display: block;
  background: #222;
  color: white;
  text-decoration: none;
  padding: 14px;
  margin: 10px auto;
  width: 90%;
  border-radius: 30px;
  font-size: 14px;
  letter-spacing: 1px;
  transition: 0.3s;
}

.btn:hover {
  background: #444;
}

/* Footer */
.footer {
  margin: 20px 0 40px;
  font-size: 14px;
  color: #444;
}
</style>
</head>

<body>

<div class="top-bg"></div>

<div class="card">
  <img src="https://images.unsplash.com/photo-1502685104226-ee32379fefbe" class="profile-img">
  
  <h1>Joshua Panimaya Raj</h1>
  <div class="subtitle">MBA | Finance & Operations</div>
  
  <div class="divider"></div>
  
  <div class="description">
    Hi! My name is Joshua.  
    I focus on finance, operations and digital automation.
  </div>

  <a href="#" class="btn">WEBSITE</a>
  <a href="#" class="btn">PORTFOLIO</a>
  <a href="#" class="btn">NEW POST</a>
  <a href="#" class="btn">MY STORE</a>
  <a href="#" class="btn">CONTACT ME</a>

</div>

<div class="footer">@joshuapersonal</div>

</body>
</html>
