<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joshua | Bio Link</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

/* ===== LIVE ANIMATED BACKGROUND ===== */
body {
  text-align: center;
  overflow-x: hidden;
  background: linear-gradient(-45deg, #d9cfc3, #e6dfd7, #cfc6bb, #ddd3c8);
  background-size: 400% 400%;
  animation: gradientMove 15s ease infinite;
}

@keyframes gradientMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* Floating background circles */
.bg-circle {
  position: fixed;
  border-radius: 50%;
  filter: blur(70px);
  opacity: 0.4;
  z-index: -1;
  animation: float 18s infinite ease-in-out alternate;
}

.circle1 {
  width: 250px;
  height: 250px;
  background: white;
  top: 5%;
  left: -80px;
}

.circle2 {
  width: 300px;
  height: 300px;
  background: black;
  bottom: 10%;
  right: -120px;
  animation-delay: 6s;
}

@keyframes float {
  from { transform: translateY(0px); }
  to { transform: translateY(50px); }
}

/* ===== ANIMATIONS ===== */
@keyframes slideUp {
  from { transform: translateY(40px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

@keyframes scaleIn {
  from { transform: scale(0.7); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

/* ===== CARD ===== */
.card {
  background: white;
  width: 90%;
  max-width: 360px;
  margin: 120px auto 30px;
  padding: 70px 20px 30px;
  border-radius: 25px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  position: relative;
  animation: slideUp 1s ease forwards;
}

/* Profile Image */
.profile-img {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  object-fit: cover;
  border: 5px solid white;
  position: absolute;
  top: -60px;
  left: 50%;
  transform: translateX(-50%);
  animation: scaleIn 1.2s ease;
}

h1 {
  font-size: 22px;
  margin-top: 10px;
}

.subtitle {
  font-size: 14px;
  color: #666;
  margin: 10px 0;
}

.divider {
  width: 40px;
  height: 2px;
  background: #333;
  margin: 10px auto 15px;
}

.description {
  font-size: 14px;
  color: #555;
  margin-bottom: 20px;
  line-height: 1.5;
}

/* Buttons */
.btn {
  display: block;
  background: #222;
  color: white;
  text-decoration: none;
  padding: 14px;
  margin: 10px auto;
  width: 90%;
  border-radius: 30px;
  font-size: 14px;
  letter-spacing: 1px;
  opacity: 0;
  animation: slideUp 0.8s ease forwards;
}

.btn:nth-of-type(1) { animation-delay: 0.3s; }
.btn:nth-of-type(2) { animation-delay: 0.5s; }
.btn:nth-of-type(3) { animation-delay: 0.7s; }
.btn:nth-of-type(4) { animation-delay: 0.9s; }
.btn:nth-of-type(5) { animation-delay: 1.1s; }

.btn:hover {
  background: #444;
  transform: scale(1.04);
  transition: 0.3s;
}

/* Footer */
.footer {
  margin: 20px 0 40px;
  font-size: 14px;
  color: #444;
  animation: slideUp 1.5s ease;
}
</style>
</head>

<body>

<!-- Background Animation -->
<div class="bg-circle circle1"></div>
<div class="bg-circle circle2"></div>

<div class="card">
  <img src="https://images.unsplash.com/photo-1502685104226-ee32379fefbe" class="profile-img">
  
  <h1>Joshua Panimaya Raj</h1>
  <div class="subtitle">MBA | Finance & Operations</div>
  
  <div class="divider"></div>
  
  <div class="description">
    Hi! I'm Joshua.  
    I specialize in finance, operations and digital automation.
  </div>

  <a href="#" class="btn">WEBSITE</a>
  <a href="#" class="btn">PORTFOLIO</a>
  <a href="#" class="btn">NEW POST</a>
  <a href="#" class="btn">MY STORE</a>
  <a href="mailto:yourmail@gmail.com" class="btn">CONTACT ME</a>
</div>

<div class="footer">@joshuapersonal</div>

<script>
/* Re-animate when returning to tab */
const originalTitle = document.title;

document.addEventListener("visibilitychange", function() {
  if (!document.hidden) {
    const card = document.querySelector(".card");
    card.style.animation = "none";
    void card.offsetWidth;
    card.style.animation = "slideUp 0.6s ease";

    document.title = "Welcome Back 👋";
    setTimeout(() => {
      document.title = originalTitle;
    }, 1500);
  }
});
</script>

</body>
</html>
